name: Platform quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_ENV: local
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_ENGINE: sqlite
      DATABASE_NAME: storage/ci.sqlite3
      CHANNEL_LAYER_BACKEND: memory
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      ONLYOFFICE_DOCUMENT_SERVER_URL: http://onlyoffice.test
      ONLYOFFICE_JWT_SECRET: ci-only-onlyoffice-secret
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary runtime directory
        run: mkdir -p storage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: python scripts/check_source_size_budgets.py
      - run: pip install -r requirements/base.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:run
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: static/frontend/
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_ENV: local
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_ENGINE: sqlite
      DATABASE_NAME: storage/e2e.sqlite3
      CHANNEL_LAYER_BACKEND: memory
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      ONLYOFFICE_DOCUMENT_SERVER_URL: http://onlyoffice.test
      ONLYOFFICE_JWT_SECRET: ci-only-onlyoffice-secret
      E2E_BASE_URL: http://127.0.0.1:8010
      E2E_SUPER_ADMIN_USERNAME: e2e_super
      E2E_SUPER_ADMIN_PASSWORD: E2eSmoke123!
      E2E_SCHOOL_ADMIN_USERNAME: e2e_school
      E2E_SCHOOL_ADMIN_PASSWORD: E2eSmoke123!
      E2E_TEACHER_USERNAME: e2e_teacher
      E2E_TEACHER_PASSWORD: E2eSmoke123!
      E2E_STUDENT_USERNAME: e2e_student
      E2E_STUDENT_PASSWORD: E2eSmoke123!
      E2E_COURSE_ID: "1"
      E2E_LESSON_ID: "1"
      E2E_AUTHORING_LESSON_ID: "1"
      E2E_CLASSROOM_ID: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary runtime directory
        run: mkdir -p storage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements/base.txt
      - working-directory: frontend
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: static/frontend
      - run: python manage.py migrate --noinput
      - name: Create isolated browser-test data
        run: python manage.py seed_e2e_quality_gate
      - name: Start application
        shell: bash
        run: |
          python manage.py runserver 127.0.0.1:8010 > storage/e2e-server.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8010/api/health/ >/dev/null && exit 0
            sleep 1
          done
          cat storage/e2e-server.log
          exit 1
      - working-directory: frontend
        run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence-${{ github.sha }}
          path: |
            storage/test-results/playwright/
            storage/e2e-server.log
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
