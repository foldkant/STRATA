{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="分页">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}{% if query %}&q={{ query }}{% endif %}{% if status %}&status={{ status }}{% endif %}{% if school_id %}&school={{ school_id }}{% endif %}">上一页</a>
    {% else %}
      <span class="disabled">上一页</span>
    {% endif %}
    <strong>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</strong>
    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}{% if query %}&q={{ query }}{% endif %}{% if status %}&status={{ status }}{% endif %}{% if school_id %}&school={{ school_id }}{% endif %}">下一页</a>
    {% else %}
      <span class="disabled">下一页</span>
    {% endif %}
  </nav>
{% endif %}
