{% extends "ops/base.html" %}

{% block content %}
  <section class="panel confirm-panel">
    <div class="panel-heading">
      <h2>删除采集记录</h2>
      <p>删除后会移除该数据采集包文件和采集记录。</p>
    </div>

    <div class="confirm-box">
      <strong>{{ import_batch.batch_code }}</strong>
      <span>{{ import_batch.source_school_code|default:"未知学校" }} · {{ import_batch.get_status_display }}</span>
    </div>

    <form method="post" class="form-actions">
      {% csrf_token %}
      <button class="danger-button" type="submit">确认删除</button>
      <a class="secondary-button" href="{{ back_url }}">取消</a>
    </form>
  </section>
{% endblock %}
