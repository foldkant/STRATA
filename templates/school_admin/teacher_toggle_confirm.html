{% extends "school_admin/base.html" %}

{% block content %}
  <section class="panel confirm-panel">
    <div class="panel-heading">
      <h2>{{ action_label }}教师</h2>
      <p>该操作只影响登录和使用权限，不删除教师历史数据。</p>
    </div>

    <div class="confirm-box">
      <strong>{{ teacher.display_name|default:teacher.username }}</strong>
      <span>{{ teacher.username }} · 当前状态：{% if teacher.is_active %}启用{% else %}停用{% endif %}</span>
    </div>

    <form method="post" class="form-actions">
      {% csrf_token %}
      <button class="{% if teacher.is_active %}danger-button{% else %}primary-button{% endif %}" type="submit">{{ action_label }}</button>
      <a class="secondary-button" href="{{ back_url }}">取消</a>
    </form>
  </section>
{% endblock %}
